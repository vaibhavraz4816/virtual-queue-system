# QueueEase Application Configuration
spring.application.name=QueueEase

# Server Port
server.port=${PORT:8080}

# Default Active Profile (can be overridden by SPRING_PROFILES_ACTIVE=mysql or h2)
spring.profiles.default=h2

# Servlet Context & Session
server.servlet.session.timeout=120m

# Jackson Date Formatting
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Kolkata

# Thymeleaf Settings
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Static Assets
spring.web.resources.static-locations=classpath:/static/

# Queue Business Logic Settings
queueease.call-grace-period-seconds=120
queueease.base-url=${APP_BASE_URL:http://localhost:8080}
queueease.demo-mode=true
