<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Error – QueueEase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="d-flex align-items-center flex-grow-1 py-5">
    <div class="container text-center">
        <div class="stat-widget-icon bg-danger bg-opacity-10 text-danger mx-auto mb-4" style="width:80px;height:80px;">
            <i class="bi bi-slash-circle-fill display-5"></i>
        </div>
        <h1 class="display-5 fw-bold text-dark mb-2">500 - Server Error</h1>
        <p class="lead text-muted col-md-6 mx-auto mb-4" th:text="${errorMessage != null ? errorMessage : 'Something went wrong on our end. Please try again shortly.'}">
            An unexpected error occurred.
        </p>
        <a th:href="@{/}" class="btn btn-primary-custom px-4 py-2">
            <i class="bi bi-house-door-fill me-1"></i> Return to Homepage
        </a>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
