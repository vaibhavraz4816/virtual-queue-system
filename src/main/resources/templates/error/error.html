<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title != null ? title + ' – QueueEase' : 'Notice – QueueEase'}">Notice – QueueEase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="d-flex align-items-center flex-grow-1 py-5">
    <div class="container text-center">
        <div class="card card-custom p-5 max-w-lg mx-auto" style="max-width: 520px;">
            <div class="stat-widget-icon bg-info bg-opacity-10 text-info mx-auto mb-3" style="width:72px;height:72px;">
                <i class="bi bi-info-circle-fill display-6"></i>
            </div>
            <h3 class="fw-bold text-dark mb-2" th:text="${title != null ? title : 'Notice'}">Queue Status Notice</h3>
            <p class="text-secondary mb-4" th:text="${errorMessage != null ? errorMessage : 'The operation cannot be completed at this time.'}">
                Notice message.
            </p>
            <div class="d-flex justify-content-center gap-2">
                <a href="javascript:history.back()" class="btn btn-outline-secondary px-3">
                    <i class="bi bi-arrow-left me-1"></i> Go Back
                </a>
                <a th:href="@{/}" class="btn btn-primary-custom px-3">
                    <i class="bi bi-house-door-fill me-1"></i> Home
                </a>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
