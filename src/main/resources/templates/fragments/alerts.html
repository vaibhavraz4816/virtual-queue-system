<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head></head>
<body>
<div th:fragment="alerts">
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show card-custom border-0 border-start border-success border-4" role="alert">
        <i class="bi bi-check-circle-fill me-2 text-success"></i>
        <span th:text="${successMessage}">Operation successful!</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show card-custom border-0 border-start border-danger border-4" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2 text-danger"></i>
        <span th:text="${errorMessage}">An error occurred.</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
</div>
</body>
</html>
