<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head></head>
<body>
<!-- Reusable QR Code Scanner Modal -->
<div th:fragment="scannerModal" class="modal fade" id="qrScannerModal" tabindex="-1" aria-labelledby="qrScannerModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg" style="border-radius: 1.25rem; overflow: hidden;">
            <div class="modal-header border-bottom-0 pb-0">
                <div class="d-flex align-items-center gap-2">
                    <div class="stat-widget-icon bg-primary bg-opacity-10 text-primary" style="width: 36px; height: 36px; font-size: 1.1rem;">
                        <i class="bi bi-qr-code-scan"></i>
                    </div>
                    <div>
                        <h5 class="modal-title fw-bold" id="qrScannerModalLabel">Scan Shop QR Code</h5>
                        <p class="text-muted small mb-0">Point your camera at the shop's poster</p>
                    </div>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <div class="modal-body p-4">
                <!-- Camera Error Alert (Hidden by default) -->
                <div id="scanner-error-alert" class="alert alert-warning py-2 small d-none mb-3" role="alert">
                    <div class="d-flex align-items-start gap-2">
                        <i class="bi bi-camera-video-off-fill fs-5 mt-1"></i>
                        <span id="scanner-error-msg">Camera access unavailable.</span>
                    </div>
                </div>

                <!-- Live Camera Viewport -->
                <div class="qr-scanner-viewport position-relative rounded-4 overflow-hidden mb-3 bg-dark d-flex align-items-center justify-content-center" style="min-height: 280px; max-height: 340px;">
                    <video id="qr-video-stream" class="w-100 h-100 object-fit-cover" playsinline autoplay muted style="transform: scaleX(-1);"></video>
                    
                    <!-- Scanner Laser & Reticle Overlay -->
                    <div class="qr-scanner-reticle position-absolute">
                        <div class="qr-scanner-laser"></div>
                    </div>

                    <!-- Guidance overlay -->
                    <div id="scanner-guide" class="position-absolute bottom-0 start-0 end-0 p-2 text-center text-white-50 small bg-dark bg-opacity-50">
                        <i class="bi bi-bounding-box me-1"></i> Align QR code within the frame
                    </div>
                </div>

                <!-- Fallback manual link input -->
                <div class="pt-2 border-top">
                    <label for="manual-queue-input" class="form-label small fw-semibold text-secondary mb-1">
                        Or enter shop link / slug manually:
                    </label>
                    <form id="manual-queue-form" class="d-flex gap-2">
                        <div class="input-group input-group-sm">
                            <span class="input-group-text bg-light text-muted">/shop/</span>
                            <input type="text" class="form-control form-control-sm" id="manual-queue-input" placeholder="e.g. classic-cuts-salon" required>
                        </div>
                        <button type="submit" class="btn btn-primary-custom btn-sm px-3 flex-shrink-0">
                            Go <i class="bi bi-arrow-right ms-1"></i>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
