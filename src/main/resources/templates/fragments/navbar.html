<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head></head>
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-custom sticky-top">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">
            <img th:src="@{/images/logo.svg}" alt="QueueEase" height="36">
        </a>
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarContent">
            <!-- Public Navigation Links (Anonymous or Customer View) -->
            <ul sec:authorize="!hasAnyRole('OWNER', 'ADMIN')" class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
                <li class="nav-item">
                    <a class="nav-link fw-semibold" href="#" data-action="open-scanner">
                        <i class="bi bi-qr-code-scan text-primary me-1"></i> Scan QR
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link fw-semibold position-relative" th:href="@{/my-queue}" id="nav-my-queue-link">
                        <i class="bi bi-ticket-perforated me-1"></i> My Queue
                        <span id="nav-my-queue-dot" class="position-absolute top-1 start-100 translate-middle p-1 bg-primary border border-light rounded-circle d-none"></span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link fw-semibold" th:href="@{/#how-it-works}">How It Works</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link fw-semibold" th:href="@{/#for-businesses}">For Businesses</a>
                </li>
            </ul>

            <!-- Authenticated Shop Owner Navigation Links -->
            <ul sec:authorize="hasAnyRole('OWNER', 'ADMIN')" class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
                <li class="nav-item">
                    <a class="nav-link fw-semibold" th:href="@{/owner/dashboard}">
                        <i class="bi bi-speedometer2 me-1"></i> Overview
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link fw-semibold" th:href="@{/owner/queue}">
                        <i class="bi bi-people me-1"></i> Live Queue
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link fw-semibold" th:href="@{/owner/qr-code}">
                        <i class="bi bi-qr-code me-1"></i> QR Code
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link fw-semibold" th:href="@{/owner/history}">
                        <i class="bi bi-clock-history me-1"></i> History
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link fw-semibold" th:href="@{/owner/profile}">
                        <i class="bi bi-gear me-1"></i> Settings
                    </a>
                </li>
            </ul>

            <!-- Right-Side Action Controls -->
            <div class="d-flex align-items-center gap-2">
                <!-- Anonymous Visitors -->
                <div sec:authorize="isAnonymous()" class="d-flex align-items-center gap-2">
                    <a th:href="@{/auth/login}" class="btn btn-outline-secondary btn-sm fw-semibold px-3 rounded-pill">
                        Owner Login
                    </a>
                    <a th:href="@{/auth/register}" class="btn btn-primary-custom btn-sm px-3 rounded-pill">
                        Get Started
                    </a>
                </div>

                <!-- Authenticated Shop Owners -->
                <div sec:authorize="isAuthenticated()" class="d-flex align-items-center gap-2">
                    <form th:action="@{/auth/logout}" method="post" class="d-inline mb-0">
                        <button type="submit" class="btn btn-outline-danger btn-sm fw-semibold px-3 rounded-pill">
                            <i class="bi bi-box-arrow-right me-1"></i> Logout
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</nav>

<script>
    // Quick indicator for active tickets in browser
    document.addEventListener('DOMContentLoaded', () => {
        try {
            const raw = localStorage.getItem('queueease_active_queues') || localStorage.getItem('qe_my_tokens');
            if (raw) {
                const arr = JSON.parse(raw);
                if (Array.isArray(arr) && arr.length > 0) {
                    const dot = document.getElementById('nav-my-queue-dot');
                    if (dot) dot.classList.remove('d-none');
                }
            }
        } catch (e) {}
    });
</script>
</body>
</html>
